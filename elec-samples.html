<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전력 애니메이션 샘플 · 연료전지 폐열 ORC</title>
  <style>
    body { margin: 0; background: #000; color: #e9e9ee; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px 40px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #8b8b95; font-size: 13px; margin-bottom: 16px; }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; font-size: 12px; color: #8b8b95; }
    .bar button { background: #1a1a1f; color: #bbb; border: 1px solid #2c2c33; border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
    .bar button.on { background: #3617CE; color: #fff; border-color: #3617CE; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { background: linear-gradient(180deg, #141418, #0b0b0e); border: 1px solid #24242a; border-radius: 14px; padding: 14px 16px 10px; }
    .card h3 { margin: 0; font-size: 14px; }
    .card h3 b { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px; background: #1864ab; color: #fff; margin-right: 8px; font-size: 12px; }
    .card p { margin: 6px 0 6px; font-size: 12px; color: #8b8b95; line-height: 1.5; min-height: 36px; }
    svg { width: 100%; height: auto; display: block; }
    .box { fill: #121216; stroke: #2f2f36; }
    .lbl { fill: #9a9aa5; font-size: 10px; }
    .base { fill: none; stroke: #1c7ed6; stroke-width: 2.5; opacity: .3; stroke-linecap: round; stroke-linejoin: round; }
    .core { fill: none; stroke: #a5d8ff; stroke-width: .8; opacity: .35; }
    .bloom, .glow, .hot { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .bloom { stroke: #1c7ed6; stroke-width: 7; opacity: .65; filter: blur(3px); }
    .glow { stroke: #4dabf7; stroke-width: 2.4; opacity: .95; filter: blur(.4px); }
    .hot { stroke: #fff; stroke-width: 1.1; }
    .bolt { fill: #e7f5ff; filter: drop-shadow(0 0 2px #74c0fc) drop-shadow(0 0 6px #1c7ed6); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>전력 애니메이션 샘플</h1>
    <div class="sub">같은 배선(ORC 2대 → 합류 → ACB) 위에 효과만 다르게 넣었습니다. 마음에 드는 알파벳을 골라 주세요.</div>
    <div class="bar">출력
      <button data-r="0.6">낮음</button><button data-r="1" class="on">보통</button><button data-r="1.5">높음</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
  (function () {
    const NS = "http://www.w3.org/2000/svg";
    const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const PATHS = ["M55 36 V95 H200", "M345 36 V95 H200", "M200 95 V150"];
    const BOLT = "M1.1 -4.4 L-2.4 .7 H-.2 L-1.1 4.4 L2.4 -.7 H.2 Z";
    let RATE = 1;

    function frameAt(w, d) {
      d = Math.max(0, Math.min(w.len, d));
      const a = w.p.getPointAtLength(d);
      const near = d + 0.8 <= w.len ? w.p.getPointAtLength(d + 0.8) : w.p.getPointAtLength(Math.max(0, d - 0.8));
      let tx = near.x - a.x, ty = near.y - a.y;
      if (d + 0.8 > w.len) { tx = -tx; ty = -ty; }
      const m = Math.hypot(tx, ty) || 1;
      return { x: a.x, y: a.y, tx: tx / m, ty: ty / m };
    }
    const off = (f, amp) => `${(f.x - f.ty * amp).toFixed(1)},${(f.y + f.tx * amp).toFixed(1)}`;

    function stage(svg) {
      [[20, 10, "ORC#1-1"], [310, 10, "ORC#1-2"], [165, 150, "ACB"]].forEach(([x, y, t]) => {
        el("rect", { x, y, width: 70, height: y === 150 ? 30 : 26, rx: 6, class: "box" }, svg);
        el("text", { x: x + 35, y: y + (y === 150 ? 19 : 17), "text-anchor": "middle", class: "lbl" }, svg).textContent = t;
      });
      return PATHS.map((d) => {
        const p = el("path", { d, class: "base" }, svg);
        el("path", { d, class: "core" }, svg);
        return { d, p, len: p.getTotalLength() };
      });
    }

    // A. 지그재그 미니 번개가 지지직거리며 흐름
    function vA(svg, P) {
      const L = 30;
      const st = P.map((w, i) => ({ w, pos: 0, active: false, wait: rnd(0, 1) + i * 0.3, jit: [], jt: 0, ls: ["bloom", "glow", "hot"].map((c) => el("polyline", { class: c }, svg)) }));
      return (dt) => {
        for (const s of st) {
          if (!s.active) { s.wait -= dt; if (s.wait > 0) continue; s.active = true; s.pos = 0; }
          s.pos += 170 * RATE * dt;
          s.jt -= dt;
          if (s.jt <= 0) { s.jt = 0.045; s.jit = Array.from({ length: 12 }, () => rnd(-1, 1)); }
          const a = Math.max(0, s.pos - L), b = Math.min(s.w.len, s.pos);
          const pts = [];
          if (b > a) {
            const n = Math.max(2, Math.round((b - a) / 3.2));
            for (let k = 0; k <= n; k++) pts.push(off(frameAt(s.w, a + ((b - a) * k) / n), k === 0 || k === n ? 0 : 3.2 * s.jit[k % 12]));
          }
          const str = pts.join(" ");
          s.ls.forEach((l) => l.setAttribute("points", str));
          if (s.pos > s.w.len + L) { s.active = false; s.wait = rnd(0.5, 1.5) / RATE; }
        }
      };
    }

    // B. 작은 번개 아이콘이 줄지어 천천히 흐름
    function vB(svg, P) {
      const GAP = 46;
      const all = P.map((w) => {
        const n = Math.max(1, Math.floor(w.len / GAP));
        return { w, n, pos: Math.random() * GAP, gs: Array.from({ length: n }, () => el("path", { d: BOLT, class: "bolt" }, svg)) };
      });
      return (dt) => {
        for (const s of all) {
          s.pos = (s.pos + 36 * RATE * dt) % s.w.len;
          s.gs.forEach((g, i) => {
            const d = (s.pos + (i * s.w.len) / s.n) % s.w.len, f = frameAt(s.w, d), fr = d / s.w.len;
            g.setAttribute("transform", `translate(${f.x.toFixed(1)} ${f.y.toFixed(1)})`);
            g.style.opacity = Math.max(0, Math.min(1, fr / 0.12, (1 - fr) / 0.12)).toFixed(2);
          });
        }
      };
    }

    // C. 번개 머리 + 짧은 빛 꼬리
    function vC(svg, P) {
      const L = 34;
      const st = P.map((w, i) => {
        const gap = w.len + L * 2 + 20;
        const layers = [["bloom", 1], ["glow", 0.6]].map(([c, f]) => {
          const p = el("path", { d: w.d, class: c }, svg);
          p.style.strokeDasharray = `${L * f} ${gap}`;
          p.style.strokeDashoffset = L * f + 1;
          return [p, L * f];
        });
        const head = el("path", { d: BOLT, class: "bolt" }, svg);
        head.style.opacity = 0;
        return { w, layers, head, pos: 0, active: false, wait: rnd(0, 1.2) + i * 0.35 };
      });
      return (dt) => {
        for (const s of st) {
          if (!s.active) { s.wait -= dt; if (s.wait > 0) continue; s.active = true; s.pos = 0; }
          s.pos += 140 * RATE * dt;
          s.layers.forEach(([p, Ld]) => { p.style.strokeDashoffset = (Ld - s.pos).toFixed(1); });
          const f = frameAt(s.w, s.pos), ang = (Math.atan2(f.ty, f.tx) * 180) / Math.PI - 90;
          s.head.setAttribute("transform", `translate(${f.x.toFixed(1)} ${f.y.toFixed(1)}) rotate(${ang.toFixed(0)}) scale(1.15)`);
          s.head.style.opacity = s.pos <= s.w.len ? 1 : 0;
          if (s.pos > s.w.len + L) { s.active = false; s.wait = rnd(0.4, 1.3) / RATE; }
        }
      };
    }

    // D. 선 곳곳에서 작은 방전이 지지직 튐 (이동 없음)
    function vD(svg, P) {
      const pool = Array.from({ length: 5 }, () => ({ ls: ["bloom", "glow", "hot"].map((c) => el("polyline", { class: c }, svg)), life: 0 }));
      let next = 0;
      return (dt) => {
        next -= dt;
        if (next <= 0) {
          next = rnd(0.12, 0.45) / RATE;
          const a = pool.find((x) => x.life <= 0);
          if (a) { const w = P[Math.floor(Math.random() * P.length)], L = rnd(14, 26); Object.assign(a, { w, L, d0: rnd(0, w.len - L), life: rnd(0.14, 0.26) }); }
        }
        for (const a of pool) {
          if (a.life <= 0) { a.ls.forEach((l) => l.setAttribute("points", "")); continue; }
          a.life -= dt;
          const pts = [];
          for (let k = 0; k <= 7; k++) pts.push(off(frameAt(a.w, a.d0 + (a.L * k) / 7), k === 0 || k === 7 ? 0 : rnd(-3.4, 3.4)));
          const vis = Math.random() > 0.18 ? pts.join(" ") : "";
          a.ls.forEach((l) => l.setAttribute("points", vis));
        }
      };
    }

    // E. 선 자체가 잔 지그재그 전류선, 빛이 그 위를 흐름
    function zig(w, amp = 2.2, step = 4) {
      const n = Math.floor(w.len / step);
      let d = "";
      for (let k = 0; k <= n; k++) {
        const f = frameAt(w, k * step), a = k === 0 || k === n ? 0 : k % 2 ? amp : -amp;
        d += `${k ? "L" : "M"}${(f.x - f.ty * a).toFixed(1)} ${(f.y + f.tx * a).toFixed(1)}`;
      }
      return d;
    }
    function vE(svg, P) {
      const st = P.map((w) => {
        const d = zig(w);
        const ls = [["bloom", "14 30", 0], ["glow", "14 30", 0], ["hot", "6 38", -8]].map(([c, dash, shift]) => {
          const p = el("path", { d, class: c }, svg);
          p.style.strokeDasharray = dash;
          return [p, shift];
        });
        return { ls, off: 0 };
      });
      return (dt) => {
        for (const s of st) {
          s.off -= 60 * RATE * dt;
          s.ls.forEach(([p, shift]) => { p.style.strokeDashoffset = (s.off + shift).toFixed(1); });
        }
      };
    }

    // F. 지금 적용된 빛줄기 (파란색)
    function vF(svg, P) {
      const L = 60;
      const st = P.map((w, i) => {
        const gap = w.len + L * 2 + 20;
        const layers = [["bloom", 1], ["glow", 0.62], ["hot", 0.26]].map(([c, f]) => {
          const p = el("path", { d: w.d, class: c }, svg);
          p.style.strokeDasharray = `${L * f} ${gap}`;
          p.style.strokeDashoffset = L * f + 1;
          return [p, L * f];
        });
        return { w, layers, pos: 0, active: false, wait: rnd(0, 1.5) + i * 0.4 };
      });
      return (dt) => {
        for (const s of st) {
          if (!s.active) { s.wait -= dt; if (s.wait > 0) continue; s.active = true; s.pos = 0; }
          s.pos += 430 * RATE * dt;
          s.layers.forEach(([p, Ld]) => { p.style.strokeDashoffset = (Ld - s.pos).toFixed(1); });
          if (s.pos > s.w.len + L) { s.active = false; s.wait = rnd(0.5, 2.6) / RATE; }
        }
      };
    }

    const VARIANTS = [
      ["A", "미니 지그재그 번개", "선보다 살짝 큰 지그재그 번개가 지지직거리며 흐릅니다.", vA],
      ["B", "번개 아이콘 줄지어 흐름", "작은 번개 아이콘이 일정 간격으로 천천히 흐릅니다.", vB],
      ["C", "번개 머리 + 빛 꼬리", "진행 방향을 향한 작은 번개 뒤로 짧은 빛 꼬리가 따라갑니다.", vC],
      ["D", "지지직 방전", "선 곳곳에서 작은 방전이 짧게 튑니다. 이동은 없습니다.", vD],
      ["E", "전류 물결선", "선이 잔 지그재그 모양이고 그 위로 빛이 잔잔히 흐릅니다.", vE],
      ["F", "빛줄기 (지금 방식, 파란색)", "비교용. 지금 화면에 들어간 빛줄기를 파란색으로 바꾼 것입니다.", vF],
    ];
    const grid = document.getElementById("grid");
    const ticks = VARIANTS.map(([k, t, d, fn]) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h3><b>${k}</b>${t}</h3><p>${d}</p>`;
      grid.appendChild(card);
      const svg = el("svg", { viewBox: "0 0 400 190" }, card);
      return fn(svg, stage(svg));
    });

    let last = 0;
    function loop(t) {
      const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
      last = t;
      ticks.forEach((f) => f(dt));
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    document.querySelector(".bar").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      RATE = Number(b.dataset.r);
      document.querySelectorAll(".bar button").forEach((x) => x.classList.toggle("on", x === b));
    });
  })();
  </script>
</body>
</html>
